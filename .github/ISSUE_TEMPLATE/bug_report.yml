name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got. Include the traceback.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short script, ideally with `wsp.ScriptedLLM` so it runs without an API key.
      render: python
  - type: input
    id: versions
    attributes:
      label: Versions
      description: weightspace, Python, torch / transformers, LLM provider and model
    validations:
      required: true
