name: Feature request
description: A new adapter, provider, tool or experiment
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API you'd like, or how you'd implement it.
